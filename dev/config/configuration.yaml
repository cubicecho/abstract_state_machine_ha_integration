# Preview instance for abstract_state_machine. Fake inputs to drive machines by hand.
default_config:

logger:
  default: warning
  logs:
    custom_components.abstract_state_machine: debug

# Dishwasher: drag the slider to fake smart-plug power, flip the door.
input_number:
  dishwasher_power:
    name: Dishwasher power
    min: 0
    max: 2000
    step: 1
    unit_of_measurement: W
    mode: slider

input_boolean:
  dishwasher_door:
    name: Dishwasher door open
  alice_phone_charging:
    name: Alice phone charging
  bob_phone_charging:
    name: Bob phone charging

# People (onboarding adds your own user as a person too).
# Move them around: Developer tools → Actions → device_tracker.see
#   (dev_id: alice_phone, location_name: home | not_home | work)
person:
  - name: Alice
    id: alice
    device_trackers: [device_tracker.alice_phone]
  - name: Bob
    id: bob
    device_trackers: [device_tracker.bob_phone]

zone:
  - name: Work
    latitude: 41.8781
    longitude: -87.6298
    radius: 200

# Per-person blocks for an example hour-type machine.
schedule:
  alice_work_hours:
    name: Alice work hours
    monday: &work [{ from: "09:00:00", to: "17:00:00" }]
    tuesday: *work
    wednesday: *work
    thursday: *work
    friday: *work
  alice_sleep:
    name: Alice sleep
    monday: &sleep [{ from: "00:00:00", to: "07:00:00" }, { from: "23:00:00", to: "23:59:59" }]
    tuesday: *sleep
    wednesday: *sleep
    thursday: *sleep
    friday: *sleep
    saturday: *sleep
    sunday: *sleep

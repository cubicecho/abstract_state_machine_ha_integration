# Throwaway Home Assistant for clicking through the UI. Not for tests.
# Run from this folder: docker compose up   →   http://localhost:8123
services:
  homeassistant:
    container_name: asm-dev-ha
    image: ghcr.io/home-assistant/home-assistant:stable  # pin to the minimum HA once the manifest sets one
    volumes:
      - ./config:/config
      - ../custom_components:/config/custom_components:ro
    environment:
      - TZ=America/Chicago
    ports:
      - "8123:8123"
    restart: "no"

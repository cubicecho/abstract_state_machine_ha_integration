[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abstract-state-machine-ha-integration"
version = "0.1.0"
description = "Home Assistant helper for user-defined state machines"
requires-python = ">=3.13"
dependencies = []

[tool.setuptools]
packages = ["custom_components.abstract_state_machine"]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-homeassistant-custom-component>=0.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 120
